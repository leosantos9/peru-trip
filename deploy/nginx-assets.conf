# Paste these directives inside the server { } block that serves the journal.
# Do not drop this file into nginx conf.d by itself: location is only valid
# inside a server block.
#
# no-cache means "store the file, but check before using it." Unchanged
# photos, video, CSS and scripts come back as a small 304. A replaced photo
# with the same filename is downloaded again. HTML stays a small first response.

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/css application/javascript text/plain application/json image/svg+xml;

location = /index.html {
    etag on;
    add_header Cache-Control "public, no-cache";
}

location /assets/ {
    etag on;
    add_header Cache-Control "public, no-cache";
}
